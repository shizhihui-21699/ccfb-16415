<!doctype html>
<html><head><meta charset="utf-8"><title>Canvas</title></head>
<body><div id="stage"></div>
<script>
// The canvas iframe receives render commands from the editor parent.
// BUG: compares event.source against window.parent, which an attacker who
// frames the *canvas* directly cannot satisfy — but the check is only applied
// in one branch, and the other branch accepts anything.
window.addEventListener('message', function (e) {
  var msg = e.data;
  if (!msg) return;
  if (msg.kind === 'render') {
    if (e.source === window.parent) {
      document.getElementById('stage').innerHTML = msg.html;
    }
    // missing else-return: falls through to the shared path below
    document.getElementById('stage').setAttribute('data-last', msg.id);
  }
  if (msg.kind === 'loadComponent') {
    // BUG: no origin/source check before a script load
    var s = document.createElement('script');
    s.src = msg.url;
    document.body.appendChild(s);
  }
});
</script>
</body></html>
