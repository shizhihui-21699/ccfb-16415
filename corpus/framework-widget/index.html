<!doctype html>
<html><head><meta charset="utf-8"><title>Framework Widget</title></head>
<body><div id="app"></div>
<script src="sdk/sdk.min.js"></script>
<script>
// Host page configures an SDK that registers its own listener.
var sdk = new WidgetSDK({
  origin: 'https://host.framework-corp.test',
  onCommand: function (cmd, payload) {
    if (cmd === 'setHtml') {
      document.getElementById('app').innerHTML = payload.html;
    }
  }
});
sdk.boot();
</script>
</body></html>
