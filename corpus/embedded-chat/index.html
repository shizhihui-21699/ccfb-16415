<!doctype html>
<html><head><meta charset="utf-8"><title>Support Chat</title></head>
<body>
<div id="messages"></div>
<button id="btn">open</button>
<script>
// Embedded customer-support widget. Accepts host-page commands.
addEventListener('message', function (event) {
  // BUG: startsWith on the origin without a trailing slash or exact compare
  if (!event.origin.startsWith('https://host.example.com')) return;
  var d = event.data || {};
  switch (d.action) {
    case 'appendMessage':
      // DOM XSS through message data
      document.getElementById('messages').insertAdjacentHTML('beforeend', d.html);
      break;
    case 'navigate':
      location.href = d.url;
      break;
    case 'eval':
      eval(d.code);
      break;
  }
});

// messageerror / no-op relay: replies with a wildcard
window.addEventListener('message', function (e) {
  if (e.data && e.data.ping) {
    e.source.postMessage({ pong: true, at: Date.now() }, '*');
  }
});
</script>
</body></html>
